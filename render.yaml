services:
  - type: web
    name: slidemath-ws
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node websocket.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        value: https://slidemath.page.gd/api
      - key: SERVER_API_KEY
        value: slidemath_ws_server_2026
      # AI (Gemini): ключ задається в дашборді Render (sync: false — не у репозиторії)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: 16384
      - key: AI_RATE_MAX
        value: 30
